name: Build and publish wherdr

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check release version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^ARG WHERDR_VERSION=v//p' Dockerfile)"
          test -n "$version"

          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            pattern='^v([0-9]+\.[0-9]+\.[0-9]+)-r[1-9][0-9]*$'
            if [[ ! "$GITHUB_REF_NAME" =~ $pattern ]] || [[ "${BASH_REMATCH[1]:-}" != "$version" ]]; then
              echo "Use v${version}-r<revision> for this version." >&2
              exit 1
            fi
          fi
          printf 'release=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build base image
        run: docker build -t wherdr:check .

      - name: Check wherdr startup
        env:
          WHERDR_RELEASE: ${{ steps.version.outputs.release }}
        shell: bash
        run: |
          container="$(docker run --detach --init wherdr:check)"
          trap 'docker rm -f "$container" >/dev/null' EXIT

          for attempt in {1..60}; do
            if health="$(docker exec "$container" curl -fsS --max-time 2 http://127.0.0.1:8080/api/health 2>/dev/null)"; then
              printf '%s\n' "$health" | jq -e --arg release "$WHERDR_RELEASE" '.ok == true and .release == $release'
              exit
            fi
            sleep 1
          done

          docker logs "$container"
          exit 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set image tag
        id: image
        shell: bash
        run: printf 'tag=ghcr.io/%s:%s\n' "${GITHUB_REPOSITORY,,}" "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
